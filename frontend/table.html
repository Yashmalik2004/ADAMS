<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h2>Database Table</h2>
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Field</th>
            <th>Type</th>
            <th>Null</th>
            <th>Key</th>
            <th>Default</th>
            <th>Extra</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Empno</td><td>int</td><td>NO</td><td>PRI</td><td>NULL</td><td></td></tr>
          <tr><td>Department</td><td>varchar(50)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>Job</td><td>varchar(50)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>Hire_date</td><td>date</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>Sal</td><td>decimal(10,2)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>Position</td><td>varchar(50)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>FirstName</td><td>varchar(50)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>LastName</td><td>varchar(50)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
          <tr><td>Email</td><td>varchar(255)</td><td>YES</td><td></td><td>NULL</td><td></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="../js/main.js"></script>
</body>
</html>
